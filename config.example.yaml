device: null
# 如果 adb 不在 PATH，可填绝对路径，例如 D:/Android/platform-tools/adb.exe。
adb_path: adb

runtime:
  dry_run: true
  loop_interval_seconds: 0.25
  screenshot_interval_seconds: 0.25
  action_cooldown_seconds: 0.45
  max_actions_per_minute: 90
  log_level: INFO
  history_file: run_history.jsonl
  history_interval_seconds: 1.0

strategy:
  # 进入关卡前手动装备对应天书，再用 --profile 约束脚本释放范围。
  active_profile: ground
  # 空中单位占比达到此值，放弃石敢当，优先火山/风系天书。
  air_ratio_threshold: 0.35
  air_count_threshold: 3
  # 符能低于此值时，不主动浪费普通符咒。
  min_energy_to_spend: 35
  reserve_energy: 25
  # 基地血量低于此值，进入保命模式。
  emergency_base_hp: 0.28
  danger_base_hp: 0.50
  # 允许前期小怪造成的血量损失，避免开局过早交资源。
  early_game_seconds: 30
  early_game_base_hp_floor: 0.42
  early_game_ground_count_to_control: 7
  ground_control_count: 4
  delay_count: 3
  boss_count: 1

profiles:
  ground:
    actions: [shigandang, xuanshuiping, qingnv, ghost_skill, ordinary_spell]
  air:
    actions: [wind_book, volcano_book, xuanshuiping, qingnv, ghost_skill, ordinary_spell]
  boss:
    actions: [qingnv, volcano_book, shigandang, xuanshuiping, ghost_skill, ordinary_spell]

screen:
  # 下面的值均为 0~1 的相对坐标，适配不同分辨率。
  playfield: [0.03, 0.10, 0.94, 0.70]
  base_hp_roi: [0.00, 0.31, 0.16, 0.37]
  energy_roi: [0.35, 0.90, 0.30, 0.08]
  # 需要按实机截图校准：符咒槽/符咒列表所在区域。卡牌位置会在此区域内动态检测。
  spell_detection:
    enabled: true
    card_roi: [0.23, 0.72, 0.56, 0.25]
    max_cards: 10
    min_card_area: 1500
  stage_roi: [0.43, 0.02, 0.18, 0.07]
  battle_detection:
    enabled: true
    min_landscape_ratio: 1.10
  default_drag_target: [0.52, 0.48]
  # 触控按钮中心，第一次使用前必须按实际截图修改。
  buttons:
    shigandang: [0.07, 0.85]
    xuanshuiping: [0.07, 0.85]
    qingnv: [0.07, 0.85]
    volcano_book: [0.07, 0.85]
    wind_book: [0.07, 0.85]
    ghost_skill: [0.88, 0.85]
    ordinary_spell: [0.32, 0.83]

  # HSV 颜色启发式；可以先运行 --inspect 查看截图，再调整。
  enemy_colors:
    ground: [[0, 60, 50], [35, 255, 255]]
    air: [[90, 40, 50], [140, 255, 255]]
    boss: [[140, 40, 50], [179, 255, 255]]
    elite: [[140, 40, 50], [179, 255, 255]]
  cooldown_detection:
    enabled: true
    roi_size: [0.07, 0.07]
    ready_score_at: 0.42
  action_rois: {}

actions:
  shigandang: {kind: drag, source: [0.07, 0.85], target: [0.52, 0.48], duration_ms: 520, cooldown: 10.0, label: 石敢当天书}
  xuanshuiping: {kind: drag, source: [0.07, 0.85], target: [0.52, 0.48], duration_ms: 520, cooldown: 8.0, label: 玄水瓶}
  qingnv: {kind: drag, source: [0.07, 0.85], target: [0.52, 0.48], duration_ms: 520, cooldown: 12.0, label: 青女}
  volcano_book: {kind: drag, source: [0.07, 0.85], target: [0.52, 0.48], duration_ms: 520, cooldown: 15.0, label: 火山天书}
  wind_book: {kind: drag, source: [0.07, 0.85], target: [0.52, 0.48], duration_ms: 520, cooldown: 15.0, label: 风系天书}
  ghost_skill: {kind: tap, cooldown: 12.0, label: 鬼仆技能}
  ordinary_spell: {kind: drag, source: [0.32, 0.83], target: [0.52, 0.48], duration_ms: 420, cooldown: 0.35, label: 普通符咒}
